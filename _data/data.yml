career-profile:
  title: Career Profile
  summary: |
    Yunjun Nam received the B.S. degree in Electronic Engineering from Hanyang University, Seoul, South Korea, in 2025. Since 2025, he has been pursuing the M.S. degree in Electrical Engineering at Pohang University of Science and Technology (POSTECH), Pohang, South Korea. His research interests include physical design optimization and AI-EDA. He is working with Prof. Seokhyeong Kang in the CAD & SoC Design Lab (CSDL).

